<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Approach | Tools</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f6f2;
      color: #183b32;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 80px 24px;
    }
    .brand {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    h1 {
      margin: 24px 0 16px;
      font: normal clamp(40px, 7vw, 64px) Georgia, serif;
    }
    p { color: #596660; line-height: 1.7; }
    .card {
      display: block;
      margin-top: 40px;
      padding: 28px;
      border: 1px solid #d9dfd9;
      border-radius: 16px;
      background: white;
      color: inherit;
      text-decoration: none;
    }
    .card:hover, .card:focus-visible {
      border-color: #183b32;
      box-shadow: 0 8px 24px #183b3210;
    }
    h2 { margin-top: 0; font-size: 22px; }
    .action { font-weight: 600; }
    footer { margin-top: 64px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Second Approach</div>
    <h1>Everyday tools.<br>Clearer decisions.</h1>
    <p>Simple calculators for work, business and everyday life.</p>

    <a class="card" href="./cpp-ei-calc/">
      <h2>Ontario Payroll Calculator</h2>
      <p>Estimate take-home pay, employer CPP and EI contributions,
         and your total CRA payroll remittance.</p>
      <span class="action">Open calculator →</span>
    </a>

    <footer>Second Approach · Tools &amp; Calculators</footer>
  </main>
</body>
</html>
